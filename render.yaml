services:
  - type: web
    name: inventario-asamblea
    runtime: python
    buildCommand: pip install -r requirements.txt
    preStartCommand: python3 run_migration.py && python3 load_seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
